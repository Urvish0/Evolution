name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Go Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run Python SDK Unit Tests
        run: pytest sdk/python/tests -v

