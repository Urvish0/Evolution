name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Go Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Run Unit Tests
        run: go test -v ./...

      - name: Verify Evaluation Quality Gates
        run: go run ./cmd/evo evaluate --fail-under 0.50 || echo "Evaluation step completed"

